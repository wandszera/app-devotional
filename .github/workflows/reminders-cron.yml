name: Reminders dispatch

# Calls the backend every ~10 min so due reminders are pushed (FCM).
# Requires repo secrets: BACKEND_BASE_URL (e.g. https://api.example.com)
# and NOTIFICATION_DISPATCH_TOKEN (same value as the backend env var).
# GitHub cron is best-effort (can lag several minutes); the dispatcher
# delivers any reminder whose time already passed today, so lag is harmless.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger dispatch
        env:
          BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          TOKEN: ${{ secrets.NOTIFICATION_DISPATCH_TOKEN }}
        run: |
          if [ -z "$BASE_URL" ]; then echo "BACKEND_BASE_URL not set; skipping"; exit 0; fi
          curl --fail-with-body --max-time 60 -X POST \
            -H "X-Dispatch-Token: $TOKEN" \
            "$BASE_URL/notifications/internal/dispatch"
